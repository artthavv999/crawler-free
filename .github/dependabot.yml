# Weekly update pull requests for npm packages and for the pinned GitHub Actions. Security-fix pull requests also need
# "Dependabot security updates" switched on in the repository settings (Settings > Code security).
# After merging an update to gsap, lenis, ogl or esbuild, run `npm run build:ui` and commit public/ (CI checks this).
# Releases are only proposed after 14 days, the same rule the pinned versions were chosen by.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
    ignore:
      # @cloudflare/vitest-pool-workers (0.23.0, the newest on 2026-10-20) only supports vitest 4 (peer ^4.1.0), so
      # vitest 5 can't be installed beside it and npm ci fails. Remove these once a release of it supports vitest 5.
      - dependency-name: vitest
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
    groups:
      dev-tooling:
        dependency-type: development
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
    groups:
      # one pull request for all actions: CodeQL's init and analyze must always move together
      actions:
        patterns: ["*"]
