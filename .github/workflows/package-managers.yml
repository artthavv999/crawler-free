# Installs crawler-free the way people without Node.js will (docs/beginner-cli-plan.md, E6): Homebrew on macOS and
# Linux from Formula/crawler-free.rb, and Scoop on Windows from bucket/crawler-free.json. Runs when either changes
# (they're regenerated by `npm run cli:manifests` after each release), and by hand from the Actions tab.
name: Package managers

on:
  push:
    branches: [main]
    paths: ["Formula/**", "bucket/**", ".github/workflows/package-managers.yml"]
  pull_request:
    paths: ["Formula/**", "bucket/**", ".github/workflows/package-managers.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  homebrew:
    name: Homebrew on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Linux ARM64 isn't here: GitHub's ARM images may not include Homebrew (the formula still covers it)
        os: [macos-15, macos-15-intel, ubuntu-24.04]
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_ANALYTICS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install from the formula, run it, test it, uninstall it
        run: |
          # Linux runners have Homebrew installed but not on the PATH
          if [ -x /home/linuxbrew/.linuxbrew/bin/brew ]; then eval "$(/home/linuxbrew/.linuxbrew/bin/brew shellenv)"; fi
          brew tap-new --no-git local/crawler-free
          cp Formula/crawler-free.rb "$(brew --repository local/crawler-free)/Formula/"
          brew install local/crawler-free/crawler-free
          crawler-free --version
          crawler-free --help > /dev/null
          brew test local/crawler-free/crawler-free
          test -f "$(brew --prefix crawler-free)/NODE-LICENSE.txt"
          brew uninstall crawler-free
          if command -v crawler-free; then echo "crawler-free is still installed"; exit 1; fi

  scoop:
    name: Scoop on Windows
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Scoop (its official installer, on this throwaway runner only)
        shell: pwsh
        run: |
          Invoke-RestMethod -Uri https://get.scoop.sh -OutFile "$env:RUNNER_TEMP\install-scoop.ps1"
          & "$env:RUNNER_TEMP\install-scoop.ps1" -RunAsAdmin
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\scoop\shims"
      - name: Install from the manifest, run it, uninstall it
        shell: pwsh
        run: |
          scoop install .\bucket\crawler-free.json
          $version = (Get-Content bucket\crawler-free.json | ConvertFrom-Json).version
          $got = crawler-free --version
          if ($got -ne $version) { throw "crawler-free --version said '$got', expected $version" }
          crawler-free --help | Out-Null
          scoop uninstall crawler-free
          if (Get-Command crawler-free -ErrorAction SilentlyContinue) { throw "still installed" }
