# Tests and security checks on every push to main, every pull request, and weekly (new advisories and secret rules
# apply to old code too). Third-party actions and images are pinned to commit SHAs / image digests; Dependabot
# proposes updates (.github/dependabot.yml).
name: Security checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Typecheck and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
        env:
          # no Workers AI binding: it needs a Cloudflare login, which CI deliberately doesn't have
          CRAWLER_WRANGLER_CONFIG: ./wrangler.ci.toml

  cli:
    name: CLI on Node ${{ matrix.node }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [22, 24] # cli/package.json engines: >=22
        include:
          - { os: macos-15, node: 24 } # macOS keeps settings in another place; the release builds run there too
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck:cli
      - run: npm run test:cli
      - run: npm run build:cli
      - name: The built command runs, and the package holds only the built file, its README and licence
        run: |
          node cli/dist/crawler-free.mjs --version
          node cli/dist/crawler-free.mjs --help > /dev/null
          cd cli && npm pack --dry-run --json | node -e "
            let s = ''; process.stdin.on('data', (d) => (s += d)).on('end', () => {
              const files = JSON.parse(s)[0].files.map((f) => f.path).sort();
              console.log(files.join('\n'));
              if (JSON.stringify(files) !== JSON.stringify(['LICENSE', 'README.md', 'dist/crawler-free.mjs', 'package.json'])) process.exit(1);
            });"
      - name: A clean install from the packed file works
        run: |
          cd cli && npm pack --pack-destination "$RUNNER_TEMP"
          npm install --global --prefix "$RUNNER_TEMP/clean" "$RUNNER_TEMP"/crawler-free-*.tgz
          "$RUNNER_TEMP/clean/bin/crawler-free" --version
          "$RUNNER_TEMP/clean/bin/crawler-free" --help > /dev/null
          npm uninstall --global --prefix "$RUNNER_TEMP/clean" crawler-free
          test ! -e "$RUNNER_TEMP/clean/bin/crawler-free"

  secrets:
    name: Gitleaks (whole git history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan every commit for secrets
        run: |
          docker run --rm -v "$PWD:/repo:ro" --entrypoint sh \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            -c 'git config --global --add safe.directory /repo && gitleaks git /repo --config /repo/.gitleaks.toml --redact --no-banner -v' # v8.30.1

  dependencies:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Deployed dependencies (fails on any advisory)
        run: npm audit --omit=dev --audit-level=low
      - name: Dev and build tools (report only; they never reach production)
        run: npm audit || true

  bundle:
    name: Built web page matches its sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:ui
      - name: Committed public/ bundles are exactly what ui/ and the locked dependencies build
        run: git diff --exit-code -- public/

  dependency-review:
    name: Dependency review (pull requests)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
