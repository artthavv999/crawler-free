# Standalone `crawler-free` downloads, which run without Node.js (docs/cli-plan.md, Phase 7).
#
# Pushing a tag cli-vX.Y.Z that matches cli/package.json builds the program on each system, tests it, and creates a
# DRAFT GitHub release with the archives, SHA256SUMS.txt and signed build provenance. Nothing is public until a
# maintainer reviews the draft and presses Publish. Running it by hand (Actions > CLI release > Run workflow) only
# builds and tests, and keeps the archives as workflow artifacts for 7 days.
name: CLI release

on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cli-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { target: linux-x64, runner: ubuntu-24.04 }
          - { target: linux-arm64, runner: ubuntu-24.04-arm }
          - { target: macos-arm64, runner: macos-15 }
          - { target: macos-x64, runner: macos-15-intel }
          - { target: windows-x64, runner: windows-2025 }
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Node 26: `node --build-sea` needs 25.5 or newer. No dependency cache in a release build.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
      - run: npm ci
      - run: npm run typecheck:cli
      - run: npm run test:cli
      - name: The tag matches the CLI version
        if: startsWith(github.ref, 'refs/tags/cli-v')
        shell: bash
        run: |
          want="cli-v$(node -p 'require("./cli/package.json").version')"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then echo "The tag $GITHUB_REF_NAME doesn't match cli/package.json ($want)."; exit 1; fi
      - run: npm run build:cli-binary
      - name: The program runs on its own, with Node.js built in
        shell: bash
        working-directory: cli/dist/sea
        run: |
          prog=./crawler-free; if [ "$RUNNER_OS" = Windows ]; then prog=./crawler-free.exe; fi
          "$prog" --version
          "$prog" --help > /dev/null
          # doctor's first check says whether Node.js is built in; port 9 is closed, so nothing leaves the runner
          "$prog" doctor --json --api-url http://127.0.0.1:9 --timeout 5 > doctor.json || true
          node -e 'const d = require("./doctor.json"); const n = d.checks[0]; console.log(n.detail); if (!n.ok || !n.detail.startsWith("Standalone build")) process.exit(1)'
          rm doctor.json
      - name: Package
        shell: bash
        run: |
          version=$(node -p 'require("./cli/package.json").version')
          name="crawler-free-$version-$TARGET"
          mkdir -p out
          cd cli/dist/sea
          if [ "$RUNNER_OS" = Windows ]; then
            7z a -tzip "../../../out/$name.zip" crawler-free.exe LICENSE NODE-LICENSE.txt
          else
            tar -czf "../../../out/$name.tar.gz" crawler-free LICENSE NODE-LICENSE.txt
          fi
          ls -l ../../../out
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crawler-free-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/cli-v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the draft release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: out
          pattern: crawler-free-*
          merge-multiple: true
      - name: Checksums
        working-directory: out
        run: |
          sha256sum crawler-free-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*
      - name: Create a draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#cli-v}"
          cat > notes.md <<EOF
          Standalone downloads of the \`crawler-free\` command, version $version. They need no Node.js: unpack and run.
          With Node.js 22 or newer you can also use \`npx crawler-free\` instead.

          | System | Download |
          |---|---|
          | Windows (x64) | \`crawler-free-$version-windows-x64.zip\` |
          | macOS, Apple silicon | \`crawler-free-$version-macos-arm64.tar.gz\` |
          | macOS, Intel | \`crawler-free-$version-macos-x64.tar.gz\` |
          | Linux (x64) | \`crawler-free-$version-linux-x64.tar.gz\` |
          | Linux (ARM64) | \`crawler-free-$version-linux-arm64.tar.gz\` |

          The programs aren't signed with a paid certificate, so Windows and macOS warn the first time:
          see "Standalone downloads" in cli/README.md. To check a download: compare it with SHA256SUMS.txt, and run
          \`gh attestation verify <file> --repo $GITHUB_REPOSITORY\` to confirm GitHub built it from this repository.
          Each archive includes Node.js's licence (NODE-LICENSE.txt), since Node.js is built in.
          EOF
          gh release create "$TAG" out/* --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "crawler-free $version" --notes-file notes.md
